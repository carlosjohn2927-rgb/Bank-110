      <stop offset="0%" stop-color="#071c35"/>
      <stop offset="100%" stop-color="#0d3a6b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f9cff"/>
      <stop offset="100%" stop-color="#1680e8"/>
